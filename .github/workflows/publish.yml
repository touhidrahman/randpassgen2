name: Publish to npm

# Publishes the package to the npm registry.
#
# Triggered by pushing a version tag such as `v2.0.1` — which is exactly what the
# `release:patch` / `release:minor` / `release:major` scripts in package.json do —
# or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# `id-token: write` is required for npm provenance (OIDC).
permissions:
  contents: read
  id-token: write

# Never run two publishes at the same time.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Reads the exact version from the "packageManager" field.
        uses: pnpm/setup@v3
        with:
            cache: true
            install: true
            require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Configure npm auth token
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: pnpm config set --location=user "//registry.npmjs.org/:_authToken" "${NODE_AUTH_TOKEN}"
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm publish --access public --no-git-checks
